# XcodeGen spec: run `xcodegen` in this folder to create Gimme.xcodeproj.
name: Gimme
options:
  bundleIdPrefix: com.gimmegolf
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Your Apple Team ID (developer.apple.com › Membership). CI passes it in from a secret.
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.9.0"
    # CI sets this to the run number so every TestFlight upload gets a new build.
    CURRENT_PROJECT_VERSION: "1"
    # Blank runs the app on demo data. From Supabase › Project Settings › API; the anon key is
    # meant to ship inside the app (the database rules in supabase/schema.sql protect the data).
    SUPABASE_URL: "https://oktrqlzfkaslwigfsmbj.supabase.co"
    SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rdHJxbHpma2FzbHdpZ2ZzbWJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MDc4MjUsImV4cCI6MjEwODA4MzgyNX0.mlDHaZM7mtraJshzkrVDet7h-_1ZFJcja5bZwcoqcOo"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.0.0"
targets:
  Gimme:
    type: application
    platform: iOS
    sources: [Gimme]
    dependencies:
      - package: Supabase
      - package: LiveKit
    info:
      path: Gimme/Info.plist
      properties:
        CFBundleDisplayName: Gimme
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Gimme only uses the encryption built into iOS (HTTPS), so no export paperwork per build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: "Gimme uses your location for distances to the green and to unlock prize drops on the hole you're playing."
        NSCameraUsageDescription: "Gimme uses the camera to film clips of your shots and to stream your round when you go live."
        NSMicrophoneUsageDescription: "Gimme records sound with your clips and live stream."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Gimme keeps GPS on during your round, even with your phone in your pocket, so you don't miss prize drops."
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        # Pages linked from sign-in and Profile. Point these at wherever website/ is hosted.
        GimmeTermsURL: "https://gimmegolf.app/terms.html"
        GimmePrivacyURL: "https://gimmegolf.app/privacy.html"
        # Satellite photos: apple (no key), mapbox (needs MapboxAccessToken) or esri (testing only
        # until you add an ArcGIS key). See README › Satellite imagery.
        SatelliteProvider: apple
        MapboxAccessToken: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gimmegolf.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  GimmeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GimmeTests]
    dependencies:
      - target: Gimme
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Gimme:
    build:
      targets:
        Gimme: all
        GimmeTests: [test]
    test:
      targets: [GimmeTests]
